name: keymaker release

on:
  push:
    tags: ['keymaker-v*']

defaults:
  run:
    working-directory: keymaker

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p keymaker-cli
      - run: |
          tar -czf keymaker-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release keymaker
      - uses: softprops/action-gh-release@v2
        with:
          files: keymaker/keymaker-${{ matrix.target }}.tar.gz
