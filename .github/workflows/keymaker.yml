name: keymaker

on:
  push:
    paths: ['keymaker/**', '.github/workflows/keymaker.yml']
  pull_request:
    paths: ['keymaker/**', '.github/workflows/keymaker.yml']

defaults:
  run:
    working-directory: keymaker

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The jail is platform code with platform-gated tests, so both must run.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: keymaker
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: CLI must refuse to read a secret
        run: |
          cargo build -q
          ! ./target/debug/keymaker get anything/at-all

      # The GUI is outside the workspace (it pulls in WebKit and needs the
      # frontend built first), so it needs its own steps or it rots unnoticed.
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: keymaker/gui/pnpm-lock.yaml }
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Test and build the frontend
        # `pnpm build` runs tsc, then the frontend tests, then vite.
        run: pnpm --dir gui install --frozen-lockfile=false && pnpm --dir gui build
      - name: Build and test the GUI crate
        working-directory: keymaker/crates/keymaker-gui
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
