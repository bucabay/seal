[package]
name = "keymaker-core"
description = "Capability-mediated secret use for AI agents: the agent acts, never holds."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
hmac.workspace = true
ureq = { workspace = true, optional = true }
ring = { workspace = true, optional = true }

[features]
default = ["http", "jwt"]
# The real network transport. Off, the broker still builds and every
# structural check still runs; only sending is unavailable.
http = ["dep:ureq"]
# RS256 signing, for exchanges that need a signed assertion (GitHub Apps).
jwt = ["dep:ring"]

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# macOS talks to the keychain through the `security` CLI (see store.rs); the
# other platforms go through `keyring`, which maps to Secret Service and
# Credential Manager.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring.workspace = true

[target.'cfg(windows)'.dependencies]
keyring.workspace = true

