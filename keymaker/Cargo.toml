[workspace]
members = ["crates/keymaker-core", "crates/keymaker-cli"]
# The GUI is excluded from the default build: it pulls in WebKit and needs the
# frontend built first. Build it with `cargo build -p keymaker-gui` from
# crates/keymaker-gui, or `pnpm tauri build`.
exclude = ["crates/keymaker-gui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/bucabay/keymaker"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hmac = "0.12"
# Already in the tree via rustls, so this adds no new crypto implementation.
# Used only for the RS256 signature a GitHub App token exchange requires.
ring = "0.17"
libc = "0.2"
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "windows-native", "vendored"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
