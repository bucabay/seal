[workspace]
members = ["crates/keymaker-core", "crates/keymaker-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/bucabay/keymaker"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
libc = "0.2"
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "windows-native", "vendored"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
